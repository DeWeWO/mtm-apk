name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Kodni yuklab olish
      uses: actions/checkout@v4
      
    - name: Java 17 o'rnatish
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Debug APK build
      run: |
        cd MTMRatsion
        gradle assembleDevelopmentDebug
        
    - name: Keystore yaratish
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd MTMRatsion
        mkdir -p keystore
        echo $KEYSTORE_BASE64 | base64 -d > keystore/mtm-ratsion-key.jks
        
    - name: Release APK build
      if: startsWith(github.ref, 'refs/tags/')
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd MTMRatsion
        cat > keystore.properties << EOF
        storeFile=keystore/mtm-ratsion-key.jks
        storePassword=$STORE_PASSWORD
        keyAlias=mtm-ratsion
        keyPassword=$KEY_PASSWORD
        EOF
        gradle assembleProductionRelease
        
    - name: APK yuklash (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: MTMRatsion-APK
        path: |
          MTMRatsion/app/build/outputs/apk/**/*.apk
          
    - name: GitHub Release yaratish
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          MTMRatsion/app/build/outputs/apk/production/release/*.apk
        body: |
          ## MTM Ratsion ${{ github.ref_name }}
          
          ### O'rnatish
          1. APK faylni yuklab oling
          2. Telefoningizda "Noma'lum manbalardan o'rnatish" ni yoqing
          3. APK ni ochib o'rnating
          
          ### Kirish
          - Foydalanuvchi nomi: admin
          - Parol: admin123
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
